version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamcrm-postgres
    restart: always
    environment:
      POSTGRES_DB: teamcrm
      POSTGRES_USER: teamcrm_user
      POSTGRES_PASSWORD: teamcrm_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: teamcrm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@teamcrm.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
